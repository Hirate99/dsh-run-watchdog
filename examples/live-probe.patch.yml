# Paid test only. Uses the production timing and observation mode.
- id: tool-pwsh
  disabled: !!js process.platform !== 'win32'
- id: tool-bash
  disabled: !!js process.platform === 'win32'
- id: tool-jobs
  disabled: false
- id: run-watchdog
  config:
    provider: deepseek
    model: deepseek-flash
    mode: shadow
    firstCheckMs: 10000
    judgeTimeoutMs: 8000
    recordPath: .integration/dsh-live-checks.jsonl
- insert:
    - id: watchdog-live-probe
      name: ../scripts/dsh-live-probe.mjs
